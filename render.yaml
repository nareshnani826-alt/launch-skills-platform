services:
  - type: web
    name: launch-skills-platform
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run db:push && npm run db:ensure-admin && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTH_EMAIL_DOMAIN
        value: launchskills.local
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NODE_VERSION
        value: 20.18.0
